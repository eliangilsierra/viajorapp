# Build, unit tests and Android lint for Viajorapp (Kotlin Multiplatform + Compose Multiplatform).
# The job is named "ci" because main and develop require that status check.
# iOS targets are declared in the modules but Kotlin/Native iOS compilation needs macOS; this Linux job
# therefore verifies the shared code on the JVM/Android only. See docs/research for the iOS limitation.

name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (shared code)
        run: ./gradlew :domain:allTests --console=plain

      - name: Android lint
        run: ./gradlew :androidApp:lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain
